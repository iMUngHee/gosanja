[package]
name = "gosanja-adapter-rust"
description = "The gosanja adapter for Rust: a rust-analyzer base index and a syn syntax layer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gosanja-schema = { version = "0.2.0", path = "../schema" }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
protobuf = "=3.7.2"
quote = { version = "1.0.47", default-features = false }
scip = "=0.10.0"
serde_json = "1.0.154"
syn = { version = "2.0.119", default-features = false, features = ["full", "visit", "parsing", "printing"] }

[dev-dependencies]
gosanja-core = { version = "0.2.0", path = "../core" }
tempfile = "3"
