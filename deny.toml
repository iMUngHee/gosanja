# Licence policy, checked by scripts/check.sh. A licence that is not listed fails the gate
# until someone reads it and adds it here.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # unicode-ident carries Unicode data tables under this permissive, OSI-approved licence.
    "Unicode-3.0",
    # borrow-or-share, through jsonschema. MIT without the attribution requirement.
    "MIT-0",
    # foldhash, through jsonschema. Permissive; altered source must be marked as altered.
    "Zlib",
]
